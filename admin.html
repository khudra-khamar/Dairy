<script>
// ========== FIREBASE INIT ==========
let auth, db;
let currentUser = null;
let currentEditId = null;
let allProblems = [];

try {
  firebase.initializeApp({
    apiKey: "AIzaSyCsdwJmEeZg0wa-OpKyccl7sbHk9fTXb6Q",
    authDomain: "dairy-manager-1.firebaseapp.com",
    projectId: "dairy-manager-1",
    storageBucket: "dairy-manager-1.firebasestorage.app",
    messagingSenderId: "724466410200",
    appId: "1:724466410200:web:14f91a33287e95d8b1edad",
    measurementId: "G-ETEEL2QSNY"
  });
  auth = firebase.auth();
  db = firebase.firestore();
  console.log(' Firebase initialized');
} catch(e) {
  console.error('Firebase init failed:', e);
  alert('Firebase Init Failed: ' + e.message);
}

// ========== TOAST ==========
function toast(msg, duration) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.remove('show'), duration || 2500);
}

// ========== LOGIN ==========
function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('loginErr');
  
  if (!email || !password) {
    errEl.textContent = ' Email  Password ';
    errEl.style.display = 'block';
    return;
  }
  
  btn.disabled = true;
  btn.textContent = ' Logging in...';
  errEl.style.display = 'none';
  
  auth.signInWithEmailAndPassword(email, password)
    .then(function(cred) {
      console.log(' Logged in:', cred.user.email);
    })
    .catch(function(err) {
      errEl.textContent = ' ' + err.message;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Login';
    });
}

function doLogout() {
  if (!confirm('Logout ?')) return;
  auth.signOut().then(function() {
    console.log(' Logged out');
    toast(' Logged out');
  });
}

// ========== AUTH STATE ==========
auth.onAuthStateChanged(function(user) {
  currentUser = user;
  
  const loginOverlay = document.getElementById('loginOverlay');
  const adminHeader = document.getElementById('adminHeader');
  const mainContainer = document.getElementById('mainContainer');
  const adminFooter = document.getElementById('adminFooter');
  const userEmail = document.getElementById('userEmail');
  const loginBtn = document.getElementById('loginBtn');
  
  if (user) {
    // Logged in
    if (loginOverlay) loginOverlay.style.display = 'none';
    if (adminHeader) adminHeader.style.display = 'flex';
    if (mainContainer) mainContainer.style.display = 'block';
    if (adminFooter) adminFooter.style.display = 'block';
    if (userEmail) userEmail.textContent = user.email.split('@')[0];
    
    loadProblems();
  } else {
    // Logged out
    if (loginOverlay) loginOverlay.style.display = 'flex';
    if (adminHeader) adminHeader.style.display = 'none';
    if (mainContainer) mainContainer.style.display = 'none';
    if (adminFooter) adminFooter.style.display = 'none';
    if (loginBtn) {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Login';
    }
    document.getElementById('loginPassword').value = '';
  }
});

// ========== LOAD PROBLEMS ==========
async function loadProblems() {
  const listEl = document.getElementById('firstAidList');
  const countEl = document.getElementById('problemCount');
  
  if (!listEl) return;
  listEl.innerHTML = '<div class="loading"> Loading...</div>';
  
  try {
    const snap = await db.collection('firstAid').orderBy('order').get();
    allProblems = [];
    snap.forEach(doc => {
      const data = doc.data();
      data.id = doc.id;
      allProblems.push(data);
    });
    
    console.log(' Loaded', allProblems.length, 'problems');
    
    if (countEl) countEl.textContent = allProblems.length;
    
    if (allProblems.length === 0) {
      listEl.innerHTML = '<div class="empty-state"><div class="icon"></div><p>  </p></div>';
      return;
    }
    
    renderList();
  } catch(e) {
    console.error('Load failed:', e);
    listEl.innerHTML = '<div class="empty-state"><div class="icon"></div><p>Load failed: ' + e.message + '</p></div>';
  }
}

// ========== RENDER LIST ==========
function renderList() {
  const listEl = document.getElementById('firstAidList');
  if (!listEl) return;
  
  listEl.innerHTML = allProblems.map(p => {
    const title = p.title_bn || p.title_en || p.id;
    const subtitle = p.title_en || p.id;
    const dosCount = (p.dos_bn || []).length;
    const dontsCount = (p.donts_bn || []).length;
    
    return '<div class="fa-card">' +
      '<div class="icon">' + (p.icon || '') + '</div>' +
      '<div class="info">' +
        '<h4>' + escapeHtml(title) + '</h4>' +
        '<p>' + escapeHtml(subtitle) + '  ' + dosCount + ' steps  ' + dontsCount + ' warnings</p>' +
      '</div>' +
      '<div class="actions">' +
        '<button class="btn-edit" onclick="openEdit(\'' + p.id + '\')"></button>' +
        '<button class="btn-del" onclick="confirmDelete(\'' + p.id + '\', \'' + escapeHtml(title).replace(/'/g, '') + '\')"></button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

console.log(' Admin App Part 3A loaded');
</script>

  const problem = allProblems.find(p => p.id === id);

    toast(' Problem not found');
    return;

  currentEditId = id;
  document.getElementById('modalTitle').textContent = ' Edit: ' + (problem.title_bn || problem.title_en || id);
  buildForm(problem, false);
  document.getElementById('editModal').classList.add('show');
}

// ========== OPEN ADD NEW ==========

    donts_bn: [''], donts_en: [''], donts_hi: [''],
    redFlags_bn: [''], redFlags_en: [''], redFlags_hi: [''],
    medicines: [],
    order: allProblems.length + 1
  };
  
  buildForm(emptyProblem, true);
  document.getElementById('editModal').classList.add('show');
}

// ========== BUILD FORM ==========
function buildForm(problem, isNew) {
  const body = document.getElementById('modalBody');
  if (!body) return;
  
  let html = '';
  
  // Basic
  html += '<div class="form-group">' +
    '<label> Icon (Emoji)</label>' +
    '<input type="text" id="f-icon" value="' + escapeAttr(problem.icon || '') + '" placeholder="" maxlength="5">' +
  '</div>';
  
  html += '<div class="form-row">' +
    '<div class="form-group">' +
      '<label> ID' + (isNew ? ' (  )' : '') + '</label>' +
      '<input type="text" id="f-id" value="' + escapeAttr(problem.id || '') + '" placeholder="fever" ' + (isNew ? '' : 'readonly') + '>' +
    '</div>' +
    '<div class="form-group">' +
      '<label> Order</label>' +
      '<input type="number" id="f-order" value="' + (problem.order || 1) + '" min="1">' +
    '</div>' +
  '</div>';
  
  // Tabs
  html += '<div class="form-tabs">' +
    '<button class="form-tab active" onclick="switchFormTab(\'bn\')" id="tab-bn"> </button>' +
    '<button class="form-tab" onclick="switchFormTab(\'en\')" id="tab-en"> English</button>' +
    '<button class="form-tab" onclick="switchFormTab(\'hi\')" id="tab-hi"> </button>' +
    '<button class="form-tab" onclick="switchFormTab(\'med\')" id="tab-med"> Medicine</button>' +
  '</div>';
  
  html += '<div class="form-tab-content active" id="content-bn">' + buildLangFields(problem, 'bn') + '</div>';
  html += '<div class="form-tab-content" id="content-en">' + buildLangFields(problem, 'en') + '</div>';
  html += '<div class="form-tab-content" id="content-hi">' + buildLangFields(problem, 'hi') + '</div>';
  html += '<div class="form-tab-content" id="content-med">' + buildMedFields(problem) + '</div>';
  
  body.innerHTML = html;
}

function buildLangFields(problem, lang) {
  const titleKey = 'title_' + lang;
  const whatKey = 'whatIsIt_' + lang;
  const dosKey = 'dos_' + lang;
  const dontsKey = 'donts_' + lang;
  const flagsKey = 'redFlags_' + lang;
  
  const titleLbl = lang === 'bn' ? '' : lang === 'en' ? 'Title' : '';
  const whatLbl = lang === 'bn' ? ' ?' : lang === 'en' ? 'What is it?' : '  ?';
  const dosLbl = lang === 'bn' ? '  ' : lang === 'en' ? ' Do Now' : '  ';
  const dontsLbl = lang === 'bn' ? '  ' : lang === 'en' ? " Don't Do" : '  ';
  const flagsLbl = lang === 'bn' ? ' Red Flags' : lang === 'en' ? ' Red Flags' : ' ';
  
  let h = '';
  
  h += '<div class="form-group">' +
    '<label>' + titleLbl + '</label>' +
    '<input type="text" id="f-' + titleKey + '" value="' + escapeAttr(problem[titleKey] || '') + '">' +
  '</div>';
  
  h += '<div class="form-group">' +
    '<label>' + whatLbl + '</label>' +
    '<textarea id="f-' + whatKey + '" rows="3">' + escapeHtml(problem[whatKey] || '') + '</textarea>' +
  '</div>';
  
  h += '<div class="form-group">' +
    '<label>' + dosLbl + '</label>' +
    '<div id="list-' + dosKey + '">';
  (problem[dosKey] || ['']).forEach(item => { h += dynamicItemHTML(item); });
  h += '</div>' +
    '<button type="button" class="btn-add-item" onclick="addDynamicItem(\'' + dosKey + '\')"> Add Step</button>' +
  '</div>';
  
  h += '<div class="form-group">' +
    '<label>' + dontsLbl + '</label>' +
    '<div id="list-' + dontsKey + '">';
  (problem[dontsKey] || ['']).forEach(item => { h += dynamicItemHTML(item); });
  h += '</div>' +
    '<button type="button" class="btn-add-item" onclick="addDynamicItem(\'' + dontsKey + '\')"> Add Warning</button>' +
  '</div>';
  
  h += '<div class="form-group">' +
    '<label>' + flagsLbl + '</label>' +
    '<div id="list-' + flagsKey + '">';
  (problem[flagsKey] || ['']).forEach(item => { h += dynamicItemHTML(item); });
  h += '</div>' +
    '<button type="button" class="btn-add-item" onclick="addDynamicItem(\'' + flagsKey + '\')"> Add Red Flag</button>' +
  '</div>';
  
  return h;
}

function dynamicItemHTML(value) {
  return '<div class="dynamic-item">' +
    '<input type="text" value="' + escapeAttr(value || '') + '" placeholder="...">' +
    '<button type="button" class="btn-remove-item" onclick="removeDynamicItem(this)"></button>' +
  '</div>';
}

function buildMedFields(problem) {
  let h = '';
  h += '<div class="form-group">' +
    '<label> Medicines</label>' +
    '<div id="list-medicines">';
  (problem.medicines || []).forEach((m) => { h += medicineItemHTML(m); });
  h += '</div>' +
    '<button type="button" class="btn-add-item" onclick="addMedicine()"> Add Medicine</button>' +
  '</div>';
  
  h += '<div style="background:#FFF3E0;padding:12px;border-radius:10px;font-size:11px;color:#E65100;line-height:1.6;margin-top:14px;">' +
    '<b> Route Examples:</b><br>' +
    '  /   / Oral<br>' +
    '  (IM) /  (IM) / IM<br>' +
    ' IV / IV / IV<br>' +
    '  /   / Topical<br>' +
    ' SC' +
  '</div>';
  return h;
}

function medicineItemHTML(med) {
  med = med || { name: '', dose: '', route_bn: '', route_en: '', route_hi: '' };
  return '<div class="med-item">' +
    '<div class="med-row">' +
      '<input type="text" class="med-name" value="' + escapeAttr(med.name) + '" placeholder="Name">' +
      '<input type="text" class="med-dose" value="' + escapeAttr(med.dose) + '" placeholder="Dose">' +
      '<input type="text" class="med-route-bn" value="' + escapeAttr(med.route_bn) + '" placeholder="Route ">' +
      '<button type="button" class="btn-remove-item" onclick="removeMedicine(this)"></button>' +
    '</div>' +
    '<div class="med-row">' +
      '<input type="text" class="med-route-en" value="' + escapeAttr(med.route_en) + '" placeholder="Route EN">' +
      '<input type="text" class="med-route-hi" value="' + escapeAttr(med.route_hi) + '" placeholder="Route ">' +
      '<div></div><div></div>' +
    '</div>' +
  '</div>';
}

function escapeAttr(str) {
  return String(str || '')
    .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function switchFormTab(lang) {
  ['bn', 'en', 'hi', 'med'].forEach(l => {
    const tab = document.getElementById('tab-' + l);
    const content = document.getElementById('content-' + l);
    if (tab) tab.classList.toggle('active', l === lang);
    if (content) content.classList.toggle('active', l === lang);
  });
}

function addDynamicItem(key) {
  const list = document.getElementById('list-' + key);
  if (!list) return;
  const div = document.createElement('div');
  div.className = 'dynamic-item';
  div.innerHTML = '<input type="text" value="" placeholder="...">' +
    '<button type="button" class="btn-remove-item" onclick="removeDynamicItem(this)"></button>';
  list.appendChild(div);
}

function removeDynamicItem(btn) {
  const item = btn.closest('.dynamic-item');
  const list = item.parentElement;
  if (list.children.length > 1) {
    item.remove();
  } else {
    item.querySelector('input').value = '';
  }
}

function addMedicine() {
  const list = document.getElementById('list-medicines');
  if (!list) return;
  const div = document.createElement('div');
  div.innerHTML = medicineItemHTML({});
  list.appendChild(div.firstElementChild);
}

function removeMedicine(btn) {
  const item = btn.closest('.med-item');
  if (item) item.remove();
}

async function saveProblem() {
  if (!currentUser) { toast(' Not logged in'); return; }
  
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = ' Saving...';
  
  try {
    const isNew = !currentEditId;
    const id = document.getElementById('f-id').value.trim().toLowerCase();
    const icon = document.getElementById('f-icon').value.trim();
    const order = parseInt(document.getElementById('f-order').value) || 1;
    
    if (!id) { toast(' ID '); saveBtn.disabled = false; saveBtn.textContent = ' Save'; return; }
    
    if (isNew && !/^[a-z0-9]+$/.test(id)) {
      toast(' ID      ');
      saveBtn.disabled = false; saveBtn.textContent = ' Save';
      return;
    }
    
    const data = {
      icon: icon,
      order: order,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    
    ['bn', 'en', 'hi'].forEach(lang => {
      data['title_' + lang] = getVal('f-title_' + lang);
      data['whatIsIt_' + lang] = getVal('f-whatIsIt_' + lang);
      data['dos_' + lang] = getDynamicList('dos_' + lang);
      data['donts_' + lang] = getDynamicList('donts_' + lang);
      data['redFlags_' + lang] = getDynamicList('redFlags_' + lang);
    });
    
    data.medicines = getMedicines();
    
    if (isNew) {
      const existing = await db.collection('firstAid').doc(id).get();
      if (existing.exists) {
        toast('  ID  ');
        saveBtn.disabled = false; saveBtn.textContent = ' Save';
        return;
      }
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection('firstAid').doc(id).set(data);
      toast('    ');
    } else {
      await db.collection('firstAid').doc(currentEditId).update(data);
      toast('  ');
    }
    
    closeEditModal();
    await loadProblems();
    
  } catch(e) {
    console.error('Save failed:', e);
    toast(' Save failed: ' + e.message);
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = ' Save';
  }
}

function getVal(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

function getDynamicList(key) {
  const list = document.getElementById('list-' + key);
  if (!list) return [];
  const arr = [];
  list.querySelectorAll('.dynamic-item input').forEach(inp => {
    const val = inp.value.trim();
    if (val) arr.push(val);
  });
  return arr;
}

function getMedicines() {
  const list = document.getElementById('list-medicines');
  if (!list) return [];
  const arr = [];
  list.querySelectorAll('.med-item').forEach(item => {
    const name = item.querySelector('.med-name').value.trim();
    if (!name) return;
    arr.push({
      name: name,
      dose: item.querySelector('.med-dose').value.trim(),
      route_bn: item.querySelector('.med-route-bn').value.trim(),
      route_en: item.querySelector('.med-route-en').value.trim(),
      route_hi: item.querySelector('.med-route-hi').value.trim()
    });
  });
  return arr;
}

function closeEditModal() {
  const modal = document.getElementById('editModal');
  if (modal) modal.classList.remove('show');
  currentEditId = null;
}

let _confirmCallback = null;

function confirmDelete(id, name) {
  document.getElementById('confirmIcon').textContent = '';
  document.getElementById('confirmTitle').textContent = 'Delete?';
  document.getElementById('confirmMsg').textContent = '"' + name + '"  ?    ';
  document.getElementById('confirmModal').classList.add('show');
  
  _confirmCallback = async function() {
    try {
      await db.collection('firstAid').doc(id).delete();
      toast('   ');
      await loadProblems();
    } catch(e) {
      console.error('Delete failed:', e);
      toast(' Delete failed: ' + e.message);
    }
  };
}

function closeConfirm(result) {
  document.getElementById('confirmModal').classList.remove('show');
  if (result && _confirmCallback) _confirmCallback();
  _confirmCallback = null;
}
